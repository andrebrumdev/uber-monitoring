name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
          - name: Windows
            os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativa o Yarn do projeto
        run: corepack enable

      - name: Instala dependências
        run: yarn install --immutable

      - name: Testes
        run: yarn test

      - name: Build
        run: yarn build

      - name: Empacota
        run: yarn electron-builder ${{ matrix.target }} --publish never
        env:
          # Sem certificado de assinatura por enquanto: builds não assinados.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Anexa na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
